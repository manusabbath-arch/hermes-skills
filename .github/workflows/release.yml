name: release

# Cada tag vX.Y.Z publica un release con SHA256SUMS de todo lo que está bajo
# skills/, para que quien instala verifique que recibió exactamente esto:
#   python3 scripts/release_manifest.py --root <copia> --check SHA256SUMS
# Sin `continue-on-error` ni `|| true`: un release que no pasó los checks no sale.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate_skills compara cada skill contra el último tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skills, scripts and trust policy
        run: python scripts/validate_skills.py

      - name: Install test deps
        run: python -m pip install --disable-pip-version-check pytest deltalake==1.6.6 duckdb==1.5.6 pyarrow==26.0.0

      - name: Run all tests
        run: python -m pytest skills scripts -q

      - name: Build and self-verify the checksum manifest
        run: |
          python scripts/release_manifest.py > SHA256SUMS
          python scripts/release_manifest.py --check SHA256SUMS

      - name: Publish release with SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
