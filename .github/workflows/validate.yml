name: validate

# No `continue-on-error`, no `|| true`, no `|| echo`. A gate that cannot fail
# is not a gate - that lesson is in empirical-project-playbook, and this repo
# has to live by it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate_skills compara cada skill contra el último tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill manifests and cited paths
        run: python scripts/validate_skills.py

      - name: Verify the numbers this repo's docs assert
        run: python skills/agent-ready-project/scripts/doc_verify.py --root . --docs README.md

      - name: Phantom wiring audit over the tap's own code
        run: python skills/agent-ready-project/scripts/phantom_wiring.py scripts skills

      - name: Published eval tables match the raw grades
        run: |
          for r in evals/runs/2026-10-18/round1 evals/runs/2026-10-18/round2; do
            python scripts/eval_report.py --grades "$r/grades" --key evals/runs/2026-10-18/key.json --evals evals/runs/2026-10-18/evals > /tmp/results.md
            diff -u "$r/results.md" /tmp/results.md
          done
          v2=evals/runs/2026-10-18-v2
          for m in haiku sonnet opus; do
            python scripts/eval_report.py --grades "$v2/$m/grades" --key "$v2/$m/key.json" --evals "$v2/evals" > /tmp/results.md
            diff -u "$v2/$m/results.md" /tmp/results.md
            python scripts/activation_eval.py score --key "$v2/activation/key.json" --answers "$v2/activation/answers/$m.json" > /tmp/results.md
            diff -u "$v2/activation/results-$m.md" /tmp/results.md
            python scripts/activation_eval.py score --key "$v2/ronda-b/activation/key.json" --answers "$v2/ronda-b/activation/answers/$m.json" > /tmp/results.md
            diff -u "$v2/ronda-b/activation/results-$m.md" /tmp/results.md
          done
          python scripts/eval_report.py --grades "$v2/ronda-b/haiku/grades" --key "$v2/ronda-b/haiku/key.json" --evals "$v2/evals" > /tmp/results.md
          diff -u "$v2/ronda-b/haiku/results.md" /tmp/results.md

      - name: Install test deps
        # El stack que delta-lakehouse y data-medallion-architecture declaran
        # validado: sus tests corren el código del SKILL.md con estas versiones.
        run: python -m pip install --disable-pip-version-check pytest deltalake==1.6.6 duckdb==1.5.6 pyarrow==26.0.0

      - name: Verify the interpreter ran (a gate must tell "failed" from "never ran")
        run: python -m pytest --version

      - name: Run shipped script and repo tests
        run: python -m pytest skills scripts -q

      - name: Checksum manifest round-trips (what a release would publish)
        run: |
          python scripts/release_manifest.py > /tmp/SHA256SUMS
          python scripts/release_manifest.py --check /tmp/SHA256SUMS

  # Quien instala puede estar en Windows. Dos bugs que este job hubiera visto: el
  # validador caía con WinError 5 (py_compile sobre NamedTemporaryFile) y un
  # SHA256SUMS de Linux no verificaba un clon con autocrlf (CRLF en cada archivo).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate_skills compara cada skill contra el último tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill manifests, trust policy and business data
        run: python scripts/validate_skills.py

      - name: Install test deps
        run: python -m pip install --disable-pip-version-check pytest deltalake==1.6.6 duckdb==1.5.6 pyarrow==26.0.0

      - name: Verify the interpreter ran
        run: python -m pytest --version

      - name: Run shipped script and repo tests
        run: python -m pytest skills scripts -q

      - name: A manifest built from git blobs (what Linux publishes) verifies this checkout
        run: |
          git ls-files skills | sort | while read -r f; do
            printf '%s  %s\n' "$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)" "$f"
          done > "$RUNNER_TEMP/SHA256SUMS"
          python scripts/release_manifest.py --check "$RUNNER_TEMP/SHA256SUMS"

  # El README promete que el tap se instala como plugin desde Claude Code 2.1.275 y
  # que el instalador deja las skills donde las leen Codex y Cursor. Este job lo
  # prueba en una configuración limpia, sin cuenta: si una skill no resuelve, rojo.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate_skills compara cada skill contra el último tag

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude Code at the minimum version the README claims
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.275

      - name: Plugin and marketplace manifests pass strict validation
        run: |
          claude --version
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json

      - name: Plugin installs in a clean config and resolves every skill
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install hermes-skills@hermes-skills
          claude plugin details hermes-skills@hermes-skills | tee /tmp/details.txt
          expected=$(ls skills/*/SKILL.md | wc -l)
          grep -E "Skills \($expected\)" /tmp/details.txt

      - name: Installer puts every skill where Codex and Cursor read them
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          python scripts/install_skills.py --target agents
          expected=$(ls skills/*/SKILL.md | wc -l)
          test "$(ls "$HOME"/.agents/skills/*/SKILL.md | wc -l)" -eq "$expected"
          if python scripts/install_skills.py --target agents; then
            echo "pisó skills existentes sin --force"; exit 1
          fi
          python scripts/install_skills.py --target agents --force
